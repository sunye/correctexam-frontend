<p-toast></p-toast>
<p-blockUI [blocked]="blocked()"></p-blockUI>

<div class="col-12">
  <div class="grid grid-nogutter align-items-center">
    <div class="col-8">
      <h2>{{ 'scanexam.anonymity.exportTitle' | translate }}</h2>
    </div>

    <div class="col-4 flex flex-row-reverse">
      <button [disabled]="!examId" type="button" class="p-button p-button-primary" (click)="gotoExam()">
        <i class="pi pi-arrow-left"></i>&nbsp;<span>Retourner à l'exam</span>
      </button>
    </div>
  </div>

  <div class="mb-3">
    <p-button icon="pi pi-refresh" label="Rafraîchir" (onClick)="refresh()" [disabled]="blocked()"></p-button>

    <p-button
      styleClass="p-button-secondary"
      icon="pi pi-download"
      label="JSON"
      (onClick)="downloadJson()"
      class="ml-2"
      [disabled]="blocked() || data.length === 0"
    ></p-button>

    <p-button
      styleClass="p-button-secondary"
      icon="pi pi-download"
      label="CSV"
      (onClick)="downloadCsv()"
      class="ml-2"
      [disabled]="blocked() || data.length === 0"
    ></p-button>
  </div>

  <p-table [value]="data" [paginator]="true" [rows]="25" [rowsPerPageOptions]="[10, 25, 50, 100]" [showCurrentPageReport]="true">
    <ng-template pTemplate="header">
      <tr>
        <th>anonymousNumber</th>
        <th>note</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-r>
      <tr>
        <td>{{ r.anonymousNumber }}</td>
        <td>{{ r.note }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="2">Aucune donnée</td>
      </tr>
    </ng-template>
  </p-table>
</div>
